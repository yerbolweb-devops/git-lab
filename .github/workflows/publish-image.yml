name: Publish Docker image

on:
  push:
    branches: [main]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Log in to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push image
        run: |
          docker build -t ghcr.io/yerbolweb-devops/bakery-site:${{ github.sha }} .
          docker push ghcr.io/yerbolweb-devops/bakery-site:${{ github.sha }}
  deploy:
    needs: publish
    runs-on: self-hosted
    

    steps: 
      - name: Pull new image
        run: docker pull ghcr.io/yerbolweb-devops/bakery-site:${{ github.sha }}
      - name: New Version 
        run: |
      - name: Deploy new version
        run: |
          if grep -q "proxy_pass http://127.0.0.1:8082;" /etc/nginx/sites-available/default; then
            ACTIVE_PORT=8082
            NEED_PORT=8083
          elif grep -q "proxy_pass http://127.0.0.1:8083;" /etc/nginx/sites-available/default; then
            ACTIVE_PORT=8083
            NEED_PORT=8082
          else
            echo "ERROR: cannot determine active Nginx backend"
            exit 1
          fi

          docker rm -f bakery-new 2>/dev/null || true

          docker run -d -p ${NEED_PORT}:80 \
            --name bakery-new \
            ghcr.io/yerbolweb-devops/bakery-site:${{ github.sha }}

          ready=false

          for i in {1..15}; do
            echo "Health check attempt $i/15"

            if curl -f http://127.0.0.1:${NEED_PORT}; then
              ready=true
              break
            fi

            sleep 2
          done

          if [ "$ready" = true ]; then
            echo "New Versin is healthy. Switching traffic."
            sudo /usr/local/sbin/switch-nginx-backend ${NEED_PORT}
            if sudo /usr/sbin/nginx -t; then
              sudo /usr/bin/systemctl reload nginx
            else
              echo "Nginx config test failed. Restoring old backend."

              sudo /usr/local/sbin/switch-nginx-backend ${ACTIVE_PORT}

              docker rm -f bakery-new 2>/dev/null || true
              exit 1 
            fi

          else
            echo "New Version failed. Keeping Old Version."

            docker rm -f bakery-new 2>/dev/null || true

            exit 1
          fi
    

