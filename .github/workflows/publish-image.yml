name: Publish Docker image

on:
  push:
    branches: [main]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Log in to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push image
        run: |
          docker build -t ghcr.io/yerbolweb-devops/bakery-site:${{ github.sha }} .
          docker push ghcr.io/yerbolweb-devops/bakery-site:${{ github.sha }}
  deploy:
    needs: publish
    runs-on: self-hosted
    

    steps: 
      - name: Pull new image
        run: docker pull ghcr.io/yerbolweb-devops/bakery-site:${{ github.sha }}
      - name: Deploy with rollback
        run: |
          docker rm -f bakery-backup 2>/dev/null || true
          docker stop bakery-live
          docker rename bakery-live bakery-backup

          if docker run -d -p 8082:80 --name bakery-live ghcr.io/yerbolweb-devops/bakery-site:${{ github.sha }} && curl -f --retry 5 --retry-delay 2 127.0.0.1:8082; then
            echo "Deployment successful"
            docker rm bakery-backup
          else
            echo "Deployment failed. Rolling back"
            docker rm -f bakery-live 2>/dev/null || true
            docker rename bakery-backup bakery-live
            docker start bakery-live
            exit 1
          fi
    
