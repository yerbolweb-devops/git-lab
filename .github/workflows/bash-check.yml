name: Bash check

on:
  push:
  pull_request:

jobs: 
  check-script:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Check Bash syntax
        run: bash -n deploy.sh
      - name: Check Docker deploy script syntax
        run: bash -n deploy-docker.sh 

      - name: Check homepage exists
        run: test -f site/index.html
      - name: Build Docker image
        run: docker build -t bakery-site:ci .
